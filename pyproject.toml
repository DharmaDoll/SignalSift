[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "signalsift"
version = "0.1.0"
description = "A low-noise, configuration-driven security signal collector."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "defusedxml>=0.7.1,<1",
  "httpx>=0.28.1,<1",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
signalsift = "signalsift.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/signalsift"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.21"
