name: SignalSift Security Profile

on:
  #schedule:
  #  - cron: "17,47 * * * *"
  #   timezone: "Asia/Tokyo"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signalsift-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run collector
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: signalsift run
