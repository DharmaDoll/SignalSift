name: SignalSift Profiles

on:
  # Enable this only after configuring Slack secrets and the state branch.
  # schedule:
  #   - cron: "17,47 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signalsift-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run --locked pytest

      - name: Run collector
        env:
          SLACK_WEBHOOK_URL_SUPPLY_CHAIN_VULNERABILITY: ${{ secrets.SLACK_WEBHOOK_URL_SUPPLY_CHAIN_VULNERABILITY }}
          SLACK_WEBHOOK_URL_AI_SECURITY: ${{ secrets.SLACK_WEBHOOK_URL_AI_SECURITY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .local/state
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/signalsift-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/signalsift-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/signalsift-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          cleanup() { rm -f "$RUNNER_TEMP/signalsift-askpass.sh"; }
          trap cleanup EXIT

          state_probe=0
          git ls-remote --exit-code --heads origin state >/dev/null || state_probe=$?
          if [ "$state_probe" -eq 0 ]; then
            git fetch origin state:refs/remotes/origin/state
          elif [ "$state_probe" -ne 2 ]; then
            echo "cannot inspect origin/state (git status $state_probe)" >&2
            exit 1
          fi
          for state_file in supply_chain_vulnerability ai_security; do
            if git show "origin/state:state/${state_file}.json" > "$RUNNER_TEMP/${state_file}.json" 2>/dev/null; then
              mv "$RUNNER_TEMP/${state_file}.json" ".local/state/${state_file}.json"
            fi
          done

          supply_status=0
          ai_status=0
          uv run --locked signalsift run \
            --profile supply-chain-vulnerability \
            --state-path .local/state/supply_chain_vulnerability.json || supply_status=$?
          uv run --locked signalsift run \
            --profile ai-security \
            --state-path .local/state/ai_security.json || ai_status=$?

          mkdir -p "$RUNNER_TEMP/signalsift-state"
          for state_path in .local/state/*.json; do
            if [ -f "$state_path" ]; then
              cp "$state_path" "$RUNNER_TEMP/signalsift-state/"
            fi
          done
          if git show-ref --verify --quiet refs/remotes/origin/state; then
            git checkout -B state origin/state
          else
            git checkout --orphan state
            git rm -rf .
          fi
          mkdir -p state
          for state_path in "$RUNNER_TEMP/signalsift-state"/*.json; do
            if [ -f "$state_path" ]; then
              cp "$state_path" state/
            fi
          done
          git add state
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: persist SignalSift notification state"
            git push origin state
          fi

          if [ "$supply_status" -ne 0 ] || [ "$ai_status" -ne 0 ]; then
            exit 1
          fi
