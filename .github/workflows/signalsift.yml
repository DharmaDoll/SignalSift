name: SignalSift Profiles

on:
  # Enable this only after configuring Slack secrets and the state branch.
  # schedule:
  #   - cron: "17,47 * * * *"

  workflow_dispatch:
    inputs:
      simulate_delivery:
        description: Test both profiles without Slack, persisting to state-test
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: signalsift-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATE_BRANCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.simulate_delivery) && 'state-test' || 'state' }}
      SIMULATE_DELIVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_delivery }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run --locked pytest

      - name: Configure Git authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/signalsift-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/signalsift-askpass.sh"
          echo "GIT_ASKPASS=$RUNNER_TEMP/signalsift-askpass.sh" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Load notification state
        id: load_state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: .github/scripts/load-state.sh

      - name: Run Supply Chain Vulnerability profile
        id: run_supply_chain
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL_SUPPLY_CHAIN_VULNERABILITY: ${{ secrets.SLACK_WEBHOOK_URL_SUPPLY_CHAIN_VULNERABILITY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          simulation_flag=()
          if [ "$SIMULATE_DELIVERY" = "true" ]; then
            simulation_flag=(--simulate-delivery)
          fi
          uv run --locked signalsift run \
            --profile supply-chain-vulnerability \
            "${simulation_flag[@]}" \
            --state-path .local/state/supply_chain_vulnerability.json

      - name: Run AI Security profile
        id: run_ai_security
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL_AI_SECURITY: ${{ secrets.SLACK_WEBHOOK_URL_AI_SECURITY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          simulation_flag=()
          if [ "$SIMULATE_DELIVERY" = "true" ]; then
            simulation_flag=(--simulate-delivery)
          fi
          uv run --locked signalsift run \
            --profile ai-security \
            "${simulation_flag[@]}" \
            --state-path .local/state/ai_security.json

      - name: Persist notification state
        if: always() && steps.load_state.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_BRANCH_EXISTS: ${{ steps.load_state.outputs.branch_exists }}
        shell: bash
        run: .github/scripts/persist-state.sh

      - name: Remove Git credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/signalsift-askpass.sh"

      - name: Report collector failure
        if: always() && (steps.run_supply_chain.outcome == 'failure' || steps.run_ai_security.outcome == 'failure')
        shell: bash
        run: |
          echo "one or more profiles failed; successful notification state was persisted" >&2
          exit 1
