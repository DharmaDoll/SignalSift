# SignalSift — Security Profile filtering policy
#
# These rules are security-specific profile data, not core engine behavior.

notification:
  threshold: 7
  initial_lookback_hours: 24
  state_retention_days: 180
  max_individual_messages_per_run: 5

negative_terms:
  # Profile-owned penalties: apply at most one negative penalty per article.
  score: -5
  terms:
    - webinar
    - event
    - conference
    - customer story
    - partnership
    - funding
    - hiring
    - careers
    - award
    - certification
    - "ウェビナー"
    - "イベント"
    - "採用"
    - "導入事例"

  mild:
    score: -3
    terms:
      - product announcement
      - release notes

rules:

  supply_chain:
    score: 3
    any:
      - supply chain attack
      - software supply chain attack
      - compromised package
      - malicious package
      - package hijack
      - package compromise
      - dependency confusion
      - typosquatting
      - maintainer compromise
      - registry compromise
      - GitHub Actions compromise
      - credential-stealing package
      - npm compromise
      - PyPI compromise
      - crates.io compromise
      - "サプライチェーン攻撃"
      - "悪性パッケージ"
      - "パッケージ改ざん"
      - "パッケージ乗っ取り"

  vulnerability:
    score: 3

    all_groups:
      - any:
          - CVE-
          - vulnerability
          - vulnerabilities
          - "脆弱性"

      - any:
          - exploited in the wild
          - active exploitation
          - known exploited
          - KEV
          - zero-day
          - 0-day
          - unauthenticated
          - pre-auth
          - remote code execution
          - RCE
          - authentication bypass
          - "悪用"
          - "実悪用"
          - "ゼロデイ"
          - "認証回避"
          - "認証不要"
          - "リモートコード実行"

  ai_security:
    score: 3

    all_groups:
      - any:
          - LLM
          - AI agent
          - AI agents
          - agentic
          - MCP
          - Model Context Protocol
          - coding assistant
          - Claude Code
          - Codex
          - RAG
          - AI IDE
          - "AIエージェント"
          - "生成AI"

      - any:
          - vulnerability
          - attack
          - exploit
          - prompt injection
          - tool poisoning
          - credential theft
          - data exfiltration
          - sandbox escape
          - authorization bypass
          - permission bypass
          - RCE
          - malicious package
          - supply chain
          - "脆弱性"
          - "攻撃"
          - "プロンプトインジェクション"
          - "情報窃取"
          - "権限回避"
          - "サプライチェーン"

boosts:

  active_exploitation:
    score: 4
    any:
      - exploited in the wild
      - active exploitation
      - known exploited
      - KEV
      - "実悪用"
      - "悪用を確認"

  severe_impact:
    score: 3
    any:
      - unauthenticated RCE
      - pre-auth RCE
      - authentication bypass
      - remote code execution
      - zero-day
      - 0-day
      - credential theft
      - credential stealer
      - "認証不要"
      - "認証回避"
      - "リモートコード実行"
      - "ゼロデイ"

  actionable:
    score: 2
    any:
      - IOC
      - IOCs
      - indicators of compromise
      - affected versions
      - remediation
      - mitigation
      - compromised versions
      - "影響を受けるバージョン"
      - "対応指針"
      - "緩和策"

watch_terms:
  score: 4

  # Keep this intentionally small.
  # Add technologies that have real local relevance.
  terms:
    - GitHub Actions
    - npm
    - PyPI
    - Kubernetes
    - container
    - MCP
    - Claude Code
    - Codex

source_priority_score:
  1: 1
  2: 2
  3: 3
