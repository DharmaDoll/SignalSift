# SignalSift — Supply Chain Vulnerability profile and source set
#
# This file intentionally owns both the profile filter and the current source
# set. Future topic profiles may define their own source-set file.

profile:
  id: supply_chain_vulnerability
  webhook_env: SLACK_WEBHOOK_URL_SUPPLY_CHAIN_VULNERABILITY
  force_notify_source_ids:
    - cisa_kev

notification:
  threshold: 7
  initial_lookback_hours: 24
  state_retention_days: 180
  max_individual_messages_per_run: 5

negative_terms:
  score: -5
  terms:
    - webinar
    - customer story
    - "ウェビナー"
    - "導入事例"
  mild:
    score: -3
    terms:
      - product announcement
      - release notes

rules:
  supply_chain_vulnerability:
    score: 5
    exclude_source_ids:
      - jpcert
    any:
      - CVE
      - CVEs
      - vulnerability
      - vulnerabilities
      - "脆弱性"
      - zero-day
      - 0-day
      - RCE
      - bypass
      - supply chain
      - compromise
      - malicious
      - typosquatting
      - dependency
      - npm
      - yarn
      - pnpm
      - PyPI
      - pip
      - conda
      - Poetry
      - package
      - crates.io
      - Maven
      - Maven Central
      - Gradle
      - NuGet
      - RubyGems
      - Bundler
      - Composer
      - Packagist
      - Go modules
      - Cargo
      - Hex
      - pub.dev
      - CPAN
      - CocoaPods
      - SwiftPM
      - Swift Package Manager
      - LuaRocks
      - Hackage
      - Cabal
      - opam
      - Conan
      - vcpkg
      - GitHub Actions
      - "サプライチェーン"
      - "パッケージ"
      - "悪用"
      - "ゼロデイ"
      - "認証回避"
      - "認証不要"
      - "リモートコード実行"
      - "バイパス"

  supply_chain_vulnerability_jpcert:
    score: 5
    source_ids:
      - jpcert
    any:
      - zero-day
      - 0-day
      - RCE
      - bypass
      - supply chain
      - compromise
      - malicious
      - typosquatting
      - dependency
      - npm
      - yarn
      - pnpm
      - PyPI
      - pip
      - package
      - crates.io
      - RubyGems
      - Cargo
      - GitHub Actions
      - "サプライチェーン"
      - "悪用"
      - "ゼロデイ"
      - "認証回避"
      - "認証不要"
      - "リモートコード実行"
      - "バイパス"

source_priority_score:
  1: 1
  2: 2
  3: 3

sources:
  - id: jpcert
    name: JPCERT/CC
    enabled: true
    type: rss
    url: https://www.jpcert.or.jp/rss/jpcert.rdf
    priority: 3
    notes: Japanese operational alerts and curated security information.

  - id: sans_isc
    name: SANS Internet Storm Center
    enabled: true
    type: rss
    url: https://isc.sans.edu/rssfeed.xml
    priority: 2
    source_filter:
      exclude:
        - ISC Stormcast
    notes: Operational attack observations and technical analysis; daily podcast entries are excluded.

  - id: cisa_kev
    name: CISA Known Exploited Vulnerabilities
    enabled: true
    type: json
    url: https://raw.githubusercontent.com/cisagov/kev-data/refs/heads/develop/known_exploited_vulnerabilities.json
    adapter: cisa_kev
    priority: 3
    notes: Confirmed exploitation signal.

  - id: flatt
    name: GMO Flatt Security
    enabled: true
    type: html
    url: https://blog.flatt.tech/
    adapter: flatt_blog
    priority: 3
    source_filter:
      exclude:
        - "社員インタビュー"
        - "採用情報"
        - "サービス紹介"
    notes: Top-page excerpts avoid full-article noise in the RSS description.

  - id: wiz
    name: Wiz
    enabled: true
    type: rss
    url: https://www.wiz.io/feed/rss.xml
    priority: 3
    source_filter:
      exclude:
        - webinar
        - customer story
        - BOD 26-04
        - Verizon DBIR
        - AI vulnerability researcher
    notes: Cloud, vulnerability, supply-chain, AI and MCP research.

  - id: stepsecurity
    name: StepSecurity
    enabled: true
    type: rss
    url: https://www.stepsecurity.io/blog/rss.xml
    priority: 3
    source_filter:
      exclude:
        - webinar
        - customer story
        - mid-year update
        - control which package registries
        - find unused, stale
        - runtime security for third-party
    notes: High-value source for active software supply-chain incidents.

  - id: aikido
    name: Aikido Security
    enabled: true
    type: rss
    url: https://www.aikido.dev/blog/rss.xml
    priority: 2
    source_filter:
      exclude:
        - customer story
        - webinar
        - company update
        - funding
        - alternatives
        - DevSec Tools & Comparisons
        - Product & Company Updates
        - benchmarking 13 AI models
        - upgrade trap
        - "Einstein of cybersecurity"
    notes: OSS malware, package compromise and vulnerability research.

  - id: google_threat_intel
    name: Google Threat Intelligence / Mandiant
    enabled: true
    type: rss
    url: https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v
    priority: 3
    match_content: false
    match_summary_chars: 500
    source_filter:
      exclude:
        - residential proxy
        - intelligence gathering apparatus
        - cloud functions
        - AI-assisted vulnerability management
    notes: Major campaigns, exploitation and AI-enabled threat research. Match only the title and first 500 summary characters because the feed description contains the full article.

  - id: github_security_blog
    name: GitHub Security Blog
    enabled: true
    type: rss
    url: https://github.blog/security/feed/
    priority: 3
    match_content: false
    source_filter:
      exclude:
        - Tame Dependabot
        - security settings every GitHub maintainer
        - Advisory Database
    notes: Official supply-chain, vulnerability, GitHub Actions, and Security Lab information. Match only title, excerpt, categories, and external IDs to avoid full-article noise.

